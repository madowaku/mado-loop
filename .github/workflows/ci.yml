name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  GODOT_RELEASE: 4.7.2-stable

jobs:
  lint-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Parse every first-party Python source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          roots = (Path('.agents/skills/mado-loop/scripts'), Path('scripts'), Path('tests'))
          files = sorted(path for root in roots for path in root.rglob('*.py'))
          if not files:
              raise SystemExit('No first-party Python files found')
          for path in files:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          print(f'Parsed {len(files)} Python files')
          PY
      - name: Reject generated files in source
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.pyc' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo 'Generated bytecode/archive found in source.' >&2
            exit 1
          fi

  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -B -m unittest discover -s tests/routing -p 'test_*.py' -v

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact unit runtime dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'numpy==2.3.2'
      - name: Require git for unit tests
        run: git --version
      - run: python -B -m unittest discover -s tests/unit -p 'test_*.py' -v

  sprite-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install and verify sprite runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'numpy==2.3.2'
          python -c "import PIL, numpy; assert PIL.__version__ == '11.3.0'; assert numpy.__version__ == '2.3.2'"
      - run: python -B -m unittest tests.unit.test_sprite_processor tests.unit.test_vendor_snapshot -v

  godot-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            archive: Godot_v4.7.2-stable_win64.exe.zip
            sha256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
            executable: Godot_v4.7.2-stable_win64_console.exe
          - os: ubuntu-24.04
            archive: Godot_v4.7.2-stable_linux.x86_64.zip
            sha256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
            executable: Godot_v4.7.2-stable_linux.x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact Godot 4.7.2 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = "https://github.com/godotengine/godot-builds/releases/download/${env:GODOT_RELEASE}/${{ matrix.archive }}"
          $archive = Join-Path $env:RUNNER_TEMP '${{ matrix.archive }}'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -cne '${{ matrix.sha256 }}') { throw "Godot SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $godot = Join-Path $install '${{ matrix.executable }}'
          if (-not $IsWindows) { chmod +x $godot }
          $versionOutput = @(& $godot --headless --version 2>&1)
          $versionExitCode = $LASTEXITCODE
          $version = (($versionOutput | ForEach-Object { $_.ToString() }) -join "`n").Trim()
          if ($versionExitCode -ne 0) { throw "Godot version probe failed with exit code $versionExitCode`: $version" }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Godot version probe returned empty output' }
          if (-not $version.StartsWith('4.7.2.stable', [StringComparison]::Ordinal)) { throw "Unexpected Godot version: $version" }
          "MADO_GODOT_BIN=$godot" >> $env:GITHUB_ENV
      - name: Install ffmpeg plus ffprobe on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Require ffmpeg plus ffprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $command = Get-Command $tool -ErrorAction Stop
            & $command.Source -version | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { throw "$tool failed" }
          }
      - name: Run live P0-P3 integration
        run: python -B -m unittest tests.integration.test_p0_p1 tests.integration.test_p2_p3 -v

  proof-tests:
    needs: godot-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            archive: Godot_v4.7.2-stable_win64.exe.zip
            sha256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
            executable: Godot_v4.7.2-stable_win64_console.exe
          - os: ubuntu-24.04
            archive: Godot_v4.7.2-stable_linux.x86_64.zip
            sha256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
            executable: Godot_v4.7.2-stable_linux.x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact Godot 4.7.2 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP '${{ matrix.archive }}'
          $install = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/${env:GODOT_RELEASE}/${{ matrix.archive }}" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -cne '${{ matrix.sha256 }}') { throw "Godot SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $godot = Join-Path $install '${{ matrix.executable }}'
          if (-not $IsWindows) { chmod +x $godot }
          $versionOutput = @(& $godot --headless --version 2>&1)
          $versionExitCode = $LASTEXITCODE
          $version = (($versionOutput | ForEach-Object { $_.ToString() }) -join "`n").Trim()
          if ($versionExitCode -ne 0) { throw "Godot version probe failed with exit code $versionExitCode`: $version" }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Godot version probe returned empty output' }
          if (-not $version.StartsWith('4.7.2.stable', [StringComparison]::Ordinal)) { throw "Unexpected Godot version: $version" }
          "MADO_GODOT_BIN=$godot" >> $env:GITHUB_ENV
      - name: Install ffmpeg plus ffprobe on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Require ffmpeg and ffprobe (no skip path)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $command = Get-Command $tool -ErrorAction Stop
            & $command.Source -version | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { throw "$tool failed" }
          }
      - name: Run unified mandatory P0-P5 runner
        run: python -B tests/run_tests.py

  package:
    needs: godot-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch pinned official Codex Skill validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openai/codex
          ref: 039eb58a0ba6647fb8f29fdd35341f3f1b153728
          path: .ci/codex
          sparse-checkout: codex-rs/skills/src/assets/samples/skill-creator/scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Run deterministic package contract
        env:
          MADO_SKILL_VALIDATOR: .ci/codex/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py
        run: python -B -m unittest tests.integration.test_package -v

  windows-install:
    needs: godot-integration
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch pinned official Codex Skill validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openai/codex
          ref: 039eb58a0ba6647fb8f29fdd35341f3f1b153728
          path: .ci/codex
          sparse-checkout: codex-rs/skills/src/assets/samples/skill-creator/scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact PowerShell 7 contract dependency
        shell: powershell
        run: choco install powershell-core --version=7.6.3 --yes --no-progress --allow-downgrade --force
      - name: Require Windows PowerShell 5.1 and PowerShell 7.6.3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.ToString() -notlike '5.1.*') { throw "Expected Windows PowerShell 5.1" }
          $pwsh = & pwsh.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($pwsh.Trim() -cne '7.6.3') { throw "Expected pwsh 7.6.3, got $pwsh" }
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Run package regression before install tests
        run: python -B -m unittest tests.integration.test_package -v
        env:
          MADO_SKILL_VALIDATOR: ${{ github.workspace }}\.ci\codex\codex-rs\skills\src\assets\samples\skill-creator\scripts\quick_validate.py
      - name: Run isolated Windows install and uninstall contract
        run: python -B -m unittest tests.integration.install.test_install -v

  license-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require attribution and vendored licenses
        shell: bash
        run: |
          set -euo pipefail
          test -s THIRD_PARTY_NOTICES.md
          test -s .agents/skills/mado-loop/vendor/godot-skill/LICENSE
          test -s .agents/skills/mado-loop/vendor/sprite-tools/LICENSE
          grep -Fq 'haxqer/godot-skill' THIRD_PARTY_NOTICES.md
          grep -Fq 'sprite-tools' THIRD_PARTY_NOTICES.md

  publish-package:
    needs:
      - lint-static
      - routing
      - unit
      - sprite-tools
      - godot-integration
      - proof-tests
      - package
      - windows-install
      - license-attribution
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build accepted package
        run: python -B scripts/package.py --output dist/mado-loop-1.0.0.zip --json
      - name: Publish only after every mandatory gate passes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mado-loop-1.0.0
          path: dist/mado-loop-1.0.0.zip
          if-no-files-found: error
          retention-days: 14
