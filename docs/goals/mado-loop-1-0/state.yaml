      - "Do not edit implementation or board files."
      - "Use primary source/license/commit evidence."
      - "Do not recommend vendoring based on popularity alone."
    expected_output:
      - "Specification delta map"
      - "Per-source VENDOR/DISTILL/ROUTE decision with SHA/license/path evidence"
      - "Result-contract migration requirements"
      - "Revised bounded task plan"
    receipt:
      result: done
