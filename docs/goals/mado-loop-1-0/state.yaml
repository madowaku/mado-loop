    constraints:
      - "Read-only."
      - "Do not edit implementation or board files."
      - "Use primary source/license/commit evidence."
      - "Do not recommend vendoring based on popularity alone."
    expected_output:
      - "Specification delta map"
      - "Per-source VENDOR/DISTILL/ROUTE decision with SHA/license/path evidence"
      - "Result-contract migration requirements"
      - "Revised bounded task plan"
    receipt:
      result: done
      summary: "Final spec adds multi-domain routing, creative/sprite/UI/reference/playtest/AI-Creole paths, task_domains+unknowns schema fields, and deterministic sprite fixtures. Keep Godot vendor; narrowly vendor agent-sprite-forge processor candidate; DISTILL UI/playtest/image-to-code/router principles; ROUTE optional ImageGen; reject unverified Pixel Art sources."
