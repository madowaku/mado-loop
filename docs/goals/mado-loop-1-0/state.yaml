version: 2

goal:
  title: "MADO LOOP 1.0 Production Build"
  slug: "mado-loop-1-0"
  kind: specific
  tranche: "Build, verify, package, document, commit, and publish the final production-orchestrator specification as version 1.0.0."
  status: active

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: T031

